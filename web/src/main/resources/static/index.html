<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Big Number + CSV Import</title>
</head>
<body>
<h2>Sum of 2 big numbers</h2>
<p>
    Stn1: <input type="text" style="width: 100px; text-align: right" placeholder="First number" id="firstNumber">
</p>
<p>
    Stn2: <input type="text" style="width: 100px; text-align: right" placeholder="Second number" id="secondNumber">
</p>
<button onclick="callApi()">Calculate</button>
<p id="result" style="color: blue; font-weight: bold;">Result is</p>
<p>
    Log: <textarea id="sumLog" rows="10" style="width: 150px;"></textarea>
</p>

<hr>

<h2>Import CSV</h2>
<p>
    CSV file: <input type="file" id="csvFile" accept=".csv,text/csv">
</p>
<p>
    Quantity column index: <input type="number" id="quantityIndex" value="1" min="0">
</p>
<p>
    Unit price column index: <input type="number" id="unitPriceIndex" value="2" min="0">
</p>
<p>
    VAT column index: <input type="number" id="vatIndex" value="3" min="0">
</p>
<button onclick="importCsv()">Import file CSV</button>
<script>
    function showData(arrayData) {
        var finalValue = '', logValue = '';
        for (var i=0;i<arrayData.length;i++) {
            if (i === 0)
                finalValue = "Result is " + arrayData[i];
            else if (i === 1)
                logValue = arrayData[i];
            else
                logValue += "\n" + arrayData[i];
        }
        document.getElementById('result').innerHTML = finalValue;
        document.getElementById('sumLog').value = logValue;
    }

    function callApi() {
        fetch('/api/sum', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                stn1: document.getElementById('firstNumber').value,
                stn2: document.getElementById('secondNumber').value
            })
        })
            .then(response => response.json())
            .then(data => showData(data));
    }

    function downloadCsvOutput(csvContent) {
        if (!csvContent || !csvContent.trim()) {
            alert('No CSV content to download.');
            return;
        }

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'output.csv';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
    }

    async function importCsv() {
        const fileInput = document.getElementById('csvFile');
        const file = fileInput.files[0];

        if (!file) {
            alert('Please choose a CSV file first.');
            return;
        }

        const formData = new FormData();
        formData.append('file', file);
        formData.append('quantityIndex', document.getElementById('quantityIndex').value);
        formData.append('unitPriceIndex', document.getElementById('unitPriceIndex').value);
        formData.append('vatIndex', document.getElementById('vatIndex').value);

        const response = await fetch('/api/csv/import', {
            method: 'POST',
            body: formData
        });

        const data = await response.json();
        if (!response.ok) {
            alert(data.message || 'CSV import failed.');
            return;
        }

        downloadCsvOutput(data.rows.join('\n'));
    }
</script>
</body>
</html>
